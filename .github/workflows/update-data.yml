name: Update OpenDART financial data

on:
  workflow_dispatch:
  schedule:
    # 매월 6일 03:20 UTC = 한국시간 12:20. 사업보고서 제출 시기를 고려한 정기 갱신.
    - cron: "20 3 6 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and analyse
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/fetch_opendart.py
          python scripts/analyze.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: update OpenDART financial data"
          git push
